<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH Field Portal | Migrant Health</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-light: #f8fafc;
            --text-dim: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }

        .blob-1 {
            top: 10%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: var(--primary);
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: 20%;
            right: 10%;
            width: 250px;
            height: 250px;
            background: var(--secondary);
            animation-delay: 2s;
        }

        .blob-3 {
            top: 40%;
            left: 40%;
            width: 200px;
            height: 200px;
            background: var(--accent);
            animation-delay: 4s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -30px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        .logo {
            font-size: 1.8em;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Login Section */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 10px;
            font-size: 2em;
        }

        .login-box p {
            color: var(--text-dim);
            margin-bottom: 30px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 0.9em;
            margin-left: 5px;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--primary);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* QR Display */
        .qr-result {
            background: white;
            color: #0f172a;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-top: 20px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qr-result img {
            max-width: 200px;
            margin: 15px 0;
        }

        /* Data Cards */
        .data-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-card h4 {
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .data-card p {
            color: var(--text-dim);
            font-size: 0.9em;
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
            display: none;
        }

        .status-msg.success {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .status-msg.error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .nav-tab {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .nav-tab.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
            color: white;
        }

        .nav-tab:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        <!-- Login Screen -->
        <div id="loginSection" class="login-wrapper">
            <div class="glass-card login-box">
                <div style="font-size: 3em; margin-bottom: 20px;">
                    <i class="fa-solid fa-user-nurse"></i>
                </div>
                <h2>Field Portal</h2>
                <p>Secure access for healthcare workers</p>

                <div class="form-group">
                    <input type="text" id="username" class="input-field" placeholder="Username" value="admin">
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="input-field" placeholder="Password" value="admin123">
                </div>
                <button class="btn" onclick="login()">
                    <i class="fa-solid fa-arrow-right"></i> Login
                </button>
                <div id="loginStatus" class="status-msg"></div>
            </div>
        </div>

        <!-- Main App Interface -->
        <div id="appInterface" class="hidden">
            <header class="header">
                <div class="logo">
                    <i class="fa-solid fa-heart-pulse"></i> SIH Health
                </div>
                <div class="user-status">
                    <span id="userRoleDisplay" style="color: var(--text-dim);">Admin</span>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </header>

            <div class="nav-tabs">
                <div class="nav-tab active" onclick="switchTab('register')">Register Migrant</div>
                <div class="nav-tab" onclick="switchTab('encounter')">Medical Encounter</div>
                <div class="nav-tab" onclick="switchTab('records')">Records</div>
            </div>

            <!-- Register Tab -->
            <div id="registerTab" class="tab-content">
                <div class="main-grid">
                    <div class="glass-card">
                        <h3 class="section-title"><i class="fa-solid fa-user-plus"></i> New Registration</h3>

                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="migrantName" class="input-field" placeholder="Enter name">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Gender</label>
                                <select id="migrantGender" class="input-field">
                                    <option value="" style="color: black;">Select</option>
                                    <option value="Male" style="color: black;">Male</option>
                                    <option value="Female" style="color: black;">Female</option>
                                    <option value="Other" style="color: black;">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Age</label>
                                <input type="number" id="migrantAge" class="input-field" placeholder="Age">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Contact Number</label>
                            <input type="tel" id="migrantContact" class="input-field" placeholder="+91-">
                        </div>

                        <div class="form-group">
                            <label>District</label>
                            <select id="migrantDistrict" class="input-field">
                                <option value="" style="color: black;">Select District</option>
                                <option value="Ernakulam" style="color: black;">Ernakulam</option>
                                <option value="Thiruvananthapuram" style="color: black;">Thiruvananthapuram</option>
                                <option value="Kozhikode" style="color: black;">Kozhikode</option>
                                <!-- Add other districts -->
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Latitude</label>
                                <input type="number" id="migrantLat" class="input-field" step="any" placeholder="Lat">
                            </div>
                            <div class="form-group">
                                <label>Longitude</label>
                                <input type="number" id="migrantLng" class="input-field" step="any" placeholder="Lng">
                            </div>
                        </div>

                        <button class="btn" onclick="registerMigrant()">Generate QR Code</button>
                        <div id="migrantStatus" class="status-msg"></div>
                    </div>

                    <div class="glass-card" id="qrResultCard" style="display: none;">
                        <h3 class="section-title"><i class="fa-solid fa-qrcode"></i> Generated QR</h3>
                        <div class="qr-result">
                            <img id="qrImage" src="" alt="QR Code">
                            <h3 style="color: #333; margin-bottom: 5px;" id="qrName"></h3>
                            <p style="color: #666; font-size: 0.9em;" id="qrId"></p>
                            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                                <button class="btn" style="width: auto; padding: 10px 20px;"
                                    onclick="downloadQR()">Download</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Encounter Tab -->
            <div id="encounterTab" class="tab-content hidden">
                <div class="glass-card" style="max-width: 800px; margin: 0 auto;">
                    <h3 class="section-title"><i class="fa-solid fa-stethoscope"></i> Medical Encounter</h3>

                    <div class="form-group">
                        <label>Select Migrant</label>
                        <select id="encounterMigrant" class="input-field">
                            <option value="" style="color: black;">Loading migrants...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Symptoms</label>
                        <textarea id="encounterSymptoms" class="input-field" rows="3"
                            placeholder="Describe symptoms..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Diagnosis</label>
                        <textarea id="encounterDiagnosis" class="input-field" rows="2"
                            placeholder="Diagnosis..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Treatment</label>
                        <textarea id="encounterTreatment" class="input-field" rows="3"
                            placeholder="Prescribed treatment..."></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Type</label>
                            <select id="encounterType" class="input-field">
                                <option value="consultation" style="color: black;">Consultation</option>
                                <option value="follow-up" style="color: black;">Follow-up</option>
                                <option value="emergency" style="color: black;">Emergency</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <input type="text" id="encounterNotes" class="input-field" placeholder="Optional notes">
                        </div>
                    </div>

                    <button class="btn" onclick="addEncounter()">Submit Encounter</button>
                    <div id="encounterStatus" class="status-msg"></div>
                </div>
            </div>

            <!-- Records Tab -->
            <div id="recordsTab" class="tab-content hidden">
                <div class="glass-card">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 class="section-title"><i class="fa-solid fa-clipboard-list"></i> Recent Records</h3>
                        <button class="btn" style="width: auto; padding: 8px 16px;" onclick="refreshData()">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
                    <div id="recentData">Loading...</div>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Simple Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId + 'Tab').classList.remove('hidden');

            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>

</html>
